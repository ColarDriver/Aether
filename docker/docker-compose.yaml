services:
  aether-harness:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    image: aether-harness:latest
    container_name: aether-harness
    working_dir: /workspace
    env_file:
      - ../.env
    environment:
      PYTHONUNBUFFERED: "1"
      AETHER_PYTHON: /opt/aether/.venv/bin/python
      AETHER_PYTHON_SRC_ROOT: /workspace
    command: ["tail", "-f", "/dev/null"]
    healthcheck:
      test: ["CMD", "python", "-c", "import aether; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  aether-tests:
    image: aether-harness:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    profiles: ["tests"]
    working_dir: /workspace
    env_file:
      - ../.env
    environment:
      PYTHONUNBUFFERED: "1"
      AETHER_PYTHON: /opt/aether/.venv/bin/python
      AETHER_PYTHON_SRC_ROOT: /workspace
    command: >
      sh -lc "
      python -m pytest &&
      npm --prefix tui run type-check &&
      npm --prefix tui test
      "
